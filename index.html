<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00b74c" />
    <script>
      // Apply the theme before the first paint, including on offline launches.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("foody-theme");
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#101a15" : "#00b74c");
      })();
    </script>
    <meta
      name="description"
      content="Dein Wochenplan, deine Rezepte und ein Kochmodus für jeden Schritt."
    />
    <link rel="icon" href="/foody_small.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Foody · Gemeinsam gut essen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
